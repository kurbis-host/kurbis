[package]
name = "kurbis-hoster"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "kurbis_hoster"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
aide = { version = "0.15.0", features = ["axum", "axum-json", "axum-query"] }
async-trait = "0.1"
async_zip = { version = "0.0.19", default-features = false, features = ["tokio", "tokio-fs", "deflate"] }
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
blake3 = "1.8"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
futures-lite = "2.6.1"
garde = { version = "0.23.0", features = ["derive"] }
libc = "0.2"
object_store = { version = "0.12", features = ["aws"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.9.0", features = ["chrono04", "uuid1"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "set-header", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package]
name = "kurbis-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "8ea2b7d1c81e977443de85d60a54155a43e9453b" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["serde"] }
wasi = { version = "0.14.7", features = ["std"] }

[workspace]

# Pumpkin's pinned Wasmtime cannot compile the unoptimized WASI component with DWARF sections.
[profile.dev]
debug = 0

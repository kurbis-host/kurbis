[package]
name = "kurbis-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
kurbis-ai-protocol = { path = "protocol"}
pumpkin-plugin-api = { path = "../../test-server/runtime/pumpkin/crates/pumpkin-plugin-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }

[workspace]
members = ["protocol"]
resolver = "2"

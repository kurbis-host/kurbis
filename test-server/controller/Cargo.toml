[package]
name = "kurbis-ai-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
kurbis-ai-protocol = { path = "../../plugins/kurbis-ai/protocol" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["fs", "io-util", "io-std", "macros", "process", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
wasmparser = "0.259"

[dev-dependencies]
tempfile = "3.23"

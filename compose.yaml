name: kurbis-hoster

x-control-plane-environment: &control-plane-environment
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  CONTROL_PLANE_LISTEN: 0.0.0.0:8080
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  ROOT_DOMAIN: ${ROOT_DOMAIN}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN}
  CI_REPOSITORY: ${CI_REPOSITORY:-Pumpkin-MC/Pumpkin}
  CI_GITHUB_PAT: ${CI_GITHUB_PAT:-}
  CI_GITHUB_API_BASE_URL: ${CI_GITHUB_API_BASE_URL:-https://api.github.com}
  CI_GITHUB_WEBHOOK_ENABLED: ${CI_GITHUB_WEBHOOK_ENABLED:-false}
  CI_DEFAULT_BRANCH: ${CI_DEFAULT_BRANCH:-master}
  # Docker is the default Compose builder. bubblewrap_ssh is also supported: it
  # delegates only the isolated build job over SSH and keeps the watcher, cache,
  # and worker on this rootless stack; native bubblewrap fixtures are never mounted.
  CI_BUILDER_BACKEND: ${CI_BUILDER_BACKEND:-docker}
  CI_BUILDER_IMAGE: ${CI_BUILDER_IMAGE:-}
  CI_TOOLCHAIN_VERSION: ${CI_TOOLCHAIN_VERSION:-1.98.1}
  CI_BUILDER_DOCKER_HOST: ${CI_BUILDER_DOCKER_HOST:-}
  CI_BUILDER_SSH_TARGET: ${CI_BUILDER_SSH_TARGET:-}
  CI_BUBBLEWRAP_PATH: ${CI_BUBBLEWRAP_PATH:-}
  CI_BUBBLEWRAP_ROOTFS: ${CI_BUBBLEWRAP_ROOTFS:-}
  CI_BUBBLEWRAP_TOOLCHAIN: ${CI_BUBBLEWRAP_TOOLCHAIN:-}
  CI_BUBBLEWRAP_WORKSPACE: ${CI_BUBBLEWRAP_WORKSPACE:-}
  CI_BUBBLEWRAP_SOURCE_PREPARER: ${CI_BUBBLEWRAP_SOURCE_PREPARER:-}
  CI_BUBBLEWRAP_RUNNER: ${CI_BUBBLEWRAP_RUNNER:-}
  CI_BUILD_CONCURRENCY: ${CI_BUILD_CONCURRENCY:-2}
  # Persistent exact-output cache. The named volume is private to the
  # unprivileged control plane; entries are logically bounded by the cache
  # implementation and never contain source-controlled executable input.
  CI_BUILD_CACHE_DIR: ${CI_BUILD_CACHE_DIR:-/home/kurbis/.cache/kurbis/build-cache}
  CI_BUILD_CACHE_MAX_BYTES: ${CI_BUILD_CACHE_MAX_BYTES:-8589934592}
  CI_PLUGIN_SOURCE: /opt/kurbis/plugins/kurbis-control
  CI_INTEGRATION_SOURCE_ROOT: /opt/kurbis
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
  DISCORD_OAUTH_CLIENT_ID: ${DISCORD_OAUTH_CLIENT_ID}
  DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_OAUTH_CLIENT_SECRET}
  OBJECT_STORE_TYPE: ${OBJECT_STORE_TYPE:-s3}
  OBJECT_STORE_LOCAL_ROOT: /var/lib/kurbis/object-store
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_ALLOW_HTTP: ${S3_ALLOW_HTTP:-false}

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 127.0.0.1:${DATABASE_PORT}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [hoster]

  control-plane:
    image: melon-hoster:local
    build:
      context: .
      dockerfile: runtime/Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
    entrypoint: [/usr/local/bin/control-plane]
    environment: *control-plane-environment
    volumes:
      - object-store:/var/lib/kurbis/object-store
      - ci-build-cache:/home/kurbis/.cache/kurbis/build-cache
      # The deployment supplies a root-owned, mode-0700 host directory whose
      # files are owned by UID 65532. Keep the default checkout path for local
      # development, but never bake a private key into the repository.
      - ${CI_BUILDER_SSH_HOST_DIRECTORY:-./deployment/ci-builder-ssh}:/home/kurbis/.ssh:ro
    ports:
      - 127.0.0.1:${CONTROL_PLANE_PORT:-18080}:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [hoster, runtime-api-egress]

  waiting-pumpkin:
    image: melon-pumpkin:waiting
    build:
      context: .
      dockerfile: runtime/pumpkin/Dockerfile
      target: waiting
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
    environment:
      PUMPKIN_HOST_CONTROL_SOCKET: /run/kurbis-gateway/host-control.sock
      PUMPKIN_HOST_CONTROL_TOKEN: ${PUMPKIN_GATEWAY_CONTROL_TOKEN}
    volumes:
      - waiting-control:/run/kurbis-gateway
    restart: unless-stopped
    networks:
      hoster:
        ipv4_address: ${WAITING_IP}

  gateway:
    image: melon-hoster:local
    entrypoint: [/usr/local/bin/gateway]
    user: "2613:2613"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JAVA_LISTEN: 0.0.0.0:25565
      JAVA_PUBLIC_PORT: ${JAVA_PORT}
      BEDROCK_LISTEN: 0.0.0.0:19132
      BEDROCK_PUBLIC_IP: ${BEDROCK_PUBLIC_IP}
      BEDROCK_PUBLIC_PORT: ${BEDROCK_PORT}
      BEDROCK_TLS_CERT_FILE: /run/kurbis-tls/fullchain.pem
      BEDROCK_TLS_KEY_FILE: /run/kurbis-tls/privkey.pem
      WAITING_JAVA_ADDRESS: ${WAITING_IP}:25566
      WAITING_BEDROCK_ADDRESS: ${WAITING_IP}:19133
      WAITING_SIGNAL_ADDRESS: ${WAITING_IP}:19132
      WAITING_CONTROL_SOCKET: /run/kurbis-gateway/host-control.sock
      PUMPKIN_GATEWAY_CONTROL_TOKEN: ${PUMPKIN_GATEWAY_CONTROL_TOKEN}
      CONTROL_PLANE_URL: http://control-plane:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
    ports:
      - ${JAVA_PORT}:25565/tcp
      - ${BEDROCK_PORT}:19132/tcp
      - ${BEDROCK_PORT}:19132/udp
    volumes:
      - waiting-control:/run/kurbis-gateway:ro
      - type: bind
        source: ${BEDROCK_TLS_HOST_DIRECTORY:-./data/certs}
        target: /run/kurbis-tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      control-plane:
        condition: service_healthy
      waiting-pumpkin:
        condition: service_healthy
    restart: unless-stopped
    networks:
      hoster:
        ipv4_address: ${GATEWAY_IP}

  panel:
    image: kurbis-panel:local
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
    ports:
      - ${PANEL_BIND_ADDRESS:-127.0.0.1}:${PANEL_PORT}:3000
    environment:
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:8080
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [hoster]

volumes:
  postgres-data:
  object-store:
  waiting-control:
  ci-build-cache:

networks:
  hoster:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}
  runtime-api-egress:
    name: kurbis-hoster_runtime-api-egress
    driver: bridge
    internal: true
